name: Build AZU Mobile Camera APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AZU-Mobile-Camera-Live-Preview-Stage1.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: |
          unzip -q "AZU-Mobile-Camera-Live-Preview-Stage1.zip" -d source
          test -f source/AZU-Mobile-Camera-Source-2/android/settings.gradle.kts
          test -f source/AZU-Mobile-Camera-Source-2/android/app/build.gradle.kts
          test -f source/AZU-Mobile-Camera-Source-2/android/app/src/main/java/com/azu/mobilecamera/MainActivity.kt

      - name: Build AZU Mobile Camera APK
        run: |
          gradle --no-daemon \
            -p source/AZU-Mobile-Camera-Source-2/android \
            assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZU-Mobile-Camera-Live-Preview-APK
          path: source/AZU-Mobile-Camera-Source-2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
