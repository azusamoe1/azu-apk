name: Build AZU Mobile Camera APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'AZU-Mobile-Camera-Live-Preview-Stage2.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: |
          unzip -q "AZU-Mobile-Camera-Live-Preview-Stage2.zip" -d source
          test -f source/AZU-Mobile-Camera-Source-2/android/settings.gradle.kts
          test -f source/AZU-Mobile-Camera-Source-2/android/app/build.gradle.kts
          test -f source/AZU-Mobile-Camera-Source-2/android/app/src/main/java/com/azu/mobilecamera/MainActivity.kt
          test -f source/AZU-Mobile-Camera-Source-2/android/app/src/main/res/layout/activity_main.xml

      # Maven Central returned HTTP 429 (rate limit) in the previous run.
      # Limit parallel dependency requests and retry transient repository failures.
      - name: Build AZU Mobile Camera APK
        env:
          GRADLE_OPTS: -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2
        run: |
          PROJECT="source/AZU-Mobile-Camera-Source-2/android"
          for attempt in 1 2 3; do
            echo "Gradle build attempt $attempt of 3"
            if gradle --no-daemon --max-workers=2 -p "$PROJECT" assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 45 seconds before retrying dependency resolution..."
              sleep 45
            fi
          done
          echo "Build failed after 3 attempts."
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AZU-Mobile-Camera-Live-Preview-Stage2-APK
          path: source/AZU-Mobile-Camera-Source-2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
